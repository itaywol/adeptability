name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Build from source with the setup-go toolchain (go1.25). The
          # prebuilt "latest" binary is built with an older Go and refuses a
          # config targeting a newer Go ("language version used to build
          # golangci-lint is lower than the targeted Go version"). v1.64.8 is
          # the last v1 release and matches the v1-format .golangci.yml.
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Test (race)
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags '-s -w' -o adept ./cmd/adept

  # The release pipeline only runs on tags, so config/hook breakage used to
  # surface after the tag existed (v1.7.0/v1.8.0 shipped with zero assets).
  # Validate what we can on every PR. Ceiling: signing is not exercised here —
  # a cosign behavior change still only fails at release time.
  release-sanity:
    name: Release sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          install-only: true
      # `check` hard-fails on the deprecated brews/dockers properties that
      # `release` still accepts. Tolerate exactly that case until the
      # homebrew_casks/dockers_v2 migration; any other failure is real.
      - name: goreleaser check
        run: |
          out=$(goreleaser check 2>&1) || {
            echo "$out"
            echo "$out" | grep -q "uses deprecated properties" || exit 1
            exit 0
          }
          echo "$out"
      - name: Completions hook
        run: |
          ./scripts/completions.sh
          for f in adept.bash adept.zsh adept.fish adept.ps1; do
            test -s "completions/$f"
          done

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Exercises postInstall, which runs the freshly built binary to generate
      # completions. Fails on vendorHash drift: if go.mod changed, update
      # vendorHash in flake.nix in the same PR.
      - name: nix build
        run: nix build .#adeptability
